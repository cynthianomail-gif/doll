<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>娃娃工坊 原型</title>
<style>
:root{--bg:#f6efe6;--panel:#fffaf3;--ink:#4a3b32;--muted:#9a8778;--accent:#e07a5f;--accent2:#c9603f;--ok:#3d9a66;--bad:#d0534a;--line:#e6d8c6;--chip:#f3e8da}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
header{max-width:1180px;margin:0 auto;padding:14px 16px 4px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:20px;margin:0;white-space:nowrap}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{padding:4px 11px;border-radius:999px;background:#ece0d0;color:var(--muted);font-size:13px}
.step.on{background:var(--accent);color:#fff;font-weight:bold}
.step.done{background:#d7ead9;color:#3d7a4f}
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;max-width:1180px;margin:0 auto;padding:10px 16px 40px}
@media(max-width:880px){main{grid-template-columns:1fr}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;min-width:0}
canvas{width:100%;height:auto;display:block;border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none}
#controls{padding:10px 4px 2px}
#status{font-size:15px;line-height:1.6;min-height:24px;margin-bottom:8px;color:var(--ink)}
#status .warn{color:var(--bad);font-weight:bold}
#status .tip{color:var(--muted);font-size:13px}
.group{margin:6px 0 10px}
.group h4{margin:0 0 6px;font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid transparent;background:var(--chip);border-radius:10px;padding:6px 9px;cursor:pointer;font:inherit;font-size:14px;color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:2px;min-width:70px;max-width:220px}
.chip:hover{border-color:#e9c9a8}
.chip.on{border-color:var(--accent);background:#fff1e8}
.chip b{font-size:14px}
.chip em{font-style:normal;color:var(--accent2);font-size:12px}
.chip small{font-size:11.5px;color:#a08b79;line-height:1.4}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;border-bottom:2px solid var(--line);padding-bottom:6px}
.tab{border:none;background:none;font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:6px}
.tab.on{background:var(--accent);color:#fff;font-weight:bold}
.tab .sw{margin:0}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid rgba(0,0,0,.15)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.btn{border:none;border-radius:10px;padding:9px 16px;font:inherit;font-size:15px;cursor:pointer;background:var(--chip);color:var(--ink);user-select:none}
.btn:hover{filter:brightness(.97)}
.btn.main{background:var(--accent);color:#fff;font-weight:bold}
.btn.main:hover{background:var(--accent2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 11px;font-size:13px}
.btn.on{outline:2px solid var(--accent)}
kbd{background:#fff;border:1px solid #d9c8b4;border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px;font-family:inherit}
aside{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card h3{margin:0 0 8px;font-size:15px}
.who{font-size:17px;font-weight:bold;display:flex;align-items:center;gap:8px}
.who .em{font-size:30px}
.quote{font-size:14.5px;line-height:1.7;margin:8px 0;color:#6a574a}
.check{list-style:none;padding:0;margin:0;font-size:14px}
.check li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.check li:last-child{border-bottom:none}
.y{color:var(--ok);font-weight:bold}.n{color:var(--bad);font-weight:bold}.q{color:var(--muted)}
.wallet{display:flex;justify-content:space-between;font-size:14px}
.tips{font-size:12.5px;line-height:1.7;color:var(--muted)}
.bars{font-size:14px;margin:4px 0 8px}
.bar{display:grid;grid-template-columns:86px 1fr 44px;gap:8px;align-items:center;margin:4px 0}
.bar i{display:block;height:9px;border-radius:5px;background:#eadccb;overflow:hidden}
.bar i b{display:block;height:100%;background:var(--accent)}
.comments{font-size:14px;line-height:1.7;margin:6px 0;padding-left:18px}
.review{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;font-size:13.5px}
.review span{background:var(--chip);border-radius:8px;padding:3px 9px}
</style>
</head>
<body>
<header>
  <h1>🧸 娃娃工坊 <small style="font-size:12px;color:var(--muted);font-weight:normal">原型 v0.3</small></h1>
  <div class="steps" id="steps"></div>
</header>
<main>
  <section class="stage">
    <canvas id="cv"></canvas>
    <div id="controls"></div>
  </section>
  <aside id="side"></aside>

<script>
// ===================== 幾何小工具（資料會用到） =====================
function ellPoly(cx,cy,rx,ry,n=40){const p=[];for(let i=0;i<n;i++){const t=i/n*2*Math.PI;p.push({x:cx+Math.cos(t)*rx,y:cy+Math.sin(t)*ry})}return p}
function qbez(a,c,b,n,out){for(let i=0;i<n;i++){const t=i/n,u=1-t;out.push({x:u*u*a.x+2*u*t*c.x+t*t*b.x,y:u*u*a.y+2*u*t*c.y+t*t*b.y})}}
function pointyPoly(w,h){const o=[];qbez({x:-w,y:.05},{x:-w*.9,y:-h*.55},{x:0,y:-h},14,o);qbez({x:0,y:-h},{x:w*.9,y:-h*.55},{x:w,y:.05},14,o);qbez({x:w,y:.05},{x:0,y:.12},{x:-w,y:.05},8,o);return o}
function hornPoly(w,h){const o=[];qbez({x:-w,y:.04},{x:-w*.7,y:-h*.6},{x:w*.35,y:-h},12,o);qbez({x:w*.35,y:-h},{x:w*.15,y:-h*.45},{x:w,y:.04},12,o);qbez({x:w,y:.04},{x:0,y:.1},{x:-w,y:.04},6,o);return o}
function wingPoly(){const o=[];qbez({x:-.08,y:.02},{x:-.26,y:-.36},{x:.06,y:-.44},12,o);qbez({x:.06,y:-.44},{x:.26,y:-.32},{x:.13,y:-.2},8,o);qbez({x:.13,y:-.2},{x:.25,y:-.1},{x:.08,y:-.01},8,o);qbez({x:.08,y:-.01},{x:0,y:.07},{x:-.08,y:.02},6,o);return o}
function heartPoly(s,dy){const o=[];for(let i=0;i<60;i++){const t=i/60*2*Math.PI,x=16*Math.sin(t)**3,y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));o.push({x:x/17*s,y:y/17*s+dy})}return o}

// ===================== 資料 =====================
// 標籤只在內部計分用，畫面上不顯示；玩家要自己解讀客人的話。
const TAGS=['可愛','溫柔','活潑','酷','復古','療癒','高級','好笑','手作感'];
const BODIES=[
 {id:'round',name:'圓滾滾',tags:['溫柔'],ax:1,ay:.92,bumps:[]},
 {id:'mochi',name:'糰子',tags:['療癒','好笑'],ax:1.22,ay:.8,bumps:[]},
 {id:'pear',name:'西洋梨',tags:['療癒'],ax:.88,ay:.95,bumps:[[40,.15,.45],[140,.15,.45]]},
 {id:'tall',name:'長身',tags:['高級'],ax:.78,ay:1.12,bumps:[]},
 {id:'square',name:'方方',tags:['好笑'],ax:1,ay:.9,p:4,bumps:[]},
 {id:'ghost',name:'幽靈',tags:['酷','好笑'],ax:.85,ay:1.02,bumps:[[52,.22,.1],[90,.24,.1],[128,.22,.1]]},
];
const PARTS={
 ears:{label:'耳朵',opts:[
  {id:'none',name:'不要'},
  {id:'round',name:'圓耳',tags:['溫柔','復古'],a:50,inset:.14,tilt:4,layer:'back',inner:true,rname:'耳',poly:()=>ellPoly(0,-.2,.25,.24)},
  {id:'long',name:'長耳',tags:['可愛','溫柔'],a:20,inset:.1,tilt:-6,layer:'back',inner:true,rname:'耳',poly:()=>ellPoly(0,-.5,.17,.56)},
  {id:'pointy',name:'尖耳',tags:['活潑','可愛'],a:42,inset:.12,tilt:2,layer:'back',inner:true,rname:'耳',poly:()=>pointyPoly(.27,.52)},
  {id:'floppy',name:'垂耳',tags:['療癒','溫柔'],a:58,inset:.06,tilt:110,layer:'front',inner:false,rname:'耳',poly:()=>ellPoly(0,-.38,.17,.44)},
  {id:'horn',name:'小角',tags:['酷'],a:32,inset:.06,tilt:-6,layer:'back',inner:false,rname:'角',poly:()=>hornPoly(.15,.42)},
 ]},
 arms:{label:'手',opts:[
  {id:'none',name:'不要'},
  {id:'nub',name:'小圓手',tags:['可愛'],a:102,inset:.12,tilt:12,layer:'back',rname:'手',poly:()=>ellPoly(0,-.17,.15,.21)},
  {id:'long',name:'長手',tags:['好笑'],a:100,inset:.08,tilt:28,layer:'back',rname:'手',poly:()=>ellPoly(0,-.4,.12,.44)},
  {id:'wing',name:'小翅膀',tags:['活潑','高級'],a:58,inset:0,tilt:38,layer:'back',rname:'翅膀',nostuff:true,poly:()=>wingPoly().map(p=>({x:p.x*1.5,y:p.y*1.5}))},
 ]},
 feet:{label:'腳',opts:[
  {id:'none',name:'不要'},
  {id:'round',name:'圓腳',tags:['溫柔'],a:150,inset:.16,down:true,layer:'front',rname:'腳',poly:()=>ellPoly(0,-.13,.21,.15)},
  {id:'long',name:'長腿',tags:['好笑'],a:156,inset:.1,down:true,layer:'front',rname:'腳',poly:()=>ellPoly(0,-.32,.11,.34)},
 ]},
 belly:{label:'肚子',opts:[
  {id:'none',name:'不要'},
  {id:'oval',name:'圓肚',tags:['療癒'],poly:()=>ellPoly(0,.3,.42,.36)},
  {id:'heart',name:'愛心肚',tags:['可愛'],poly:()=>heartPoly(.4,.32)},
 ]},
};
Object.values(PARTS).forEach(g=>g.opts.forEach(o=>{if(o.poly)o.P=o.poly()}));
const SLOTS=[['body','身體'],['ears','耳朵'],['earInner','耳朵內側'],['arms','手'],['feet','腳'],['belly','肚子']];
const SLOT_NAME=Object.fromEntries(SLOTS);
const MATERIALS=[
 {id:'felt',name:'不織布',tags:['手作感','復古'],p10:1,gloss:.25,stretch:.8,grain:'none',desc:'沒有布紋，怎麼排都行。硬挺，有一種古早的手工味。'},
 {id:'cotton',name:'印花棉布',tags:['活潑','可愛'],p10:2,gloss:.5,stretch:1,grain:'two',desc:'有布紋（可上下顛倒）。花色明亮，看了心情好。'},
 {id:'knit',name:'毛線針織',tags:['溫柔','復古'],p10:2,gloss:.35,stretch:1.3,grain:'two',desc:'很會延展，摸起來暖暖的。布紋排歪會塞得凹凸不平。'},
 {id:'minky',name:'短絨毛',tags:['療癒','高級'],p10:3,gloss:.9,stretch:1.1,grain:'one',desc:'毛有順向，不能顛倒排。摸起來像雲一樣。'},
];
const COLORS=[
 {id:'cream',name:'奶油白',hex:'#f3e7d3',tags:['溫柔']},
 {id:'pink',name:'櫻花粉',hex:'#f4b6c6',tags:['可愛']},
 {id:'sky',name:'天空藍',hex:'#a9d3ee',tags:['療癒']},
 {id:'lemon',name:'檸檬黃',hex:'#f6d96b',tags:['活潑']},
 {id:'mint',name:'薄荷綠',hex:'#a6dcc0',tags:['療癒']},
 {id:'brick',name:'磚紅',hex:'#b4573f',tags:['復古']},
 {id:'grape',name:'葡萄紫',hex:'#8e70b4',tags:['高級']},
 {id:'coal',name:'炭黑',hex:'#3d3c43',tags:['酷']},
];
const MAT_BY=Object.fromEntries(MATERIALS.map(m=>[m.id,m])),COLOR_BY=Object.fromEntries(COLORS.map(c=>[c.id,c]));
const DECOR=[
 {id:'eyes_button',name:'鈕扣眼',tags:['復古','手作感'],cost:15,pos:'eyes',hit:40},
 {id:'eyes_stitch',name:'刺繡瞇瞇眼',tags:['溫柔','療癒'],cost:10,pos:'eyes',hit:40},
 {id:'eyes_dot',name:'豆豆眼',tags:['好笑','可愛'],cost:5,pos:'eyes',hit:38},
 {id:'eyes_sparkle',name:'閃亮大眼',tags:['可愛','高級'],cost:30,pos:'eyes',hit:42},
 {id:'eyes_x',name:'叉叉眼',tags:['酷','好笑'],cost:8,pos:'eyes',hit:40},
 {id:'nose',name:'三角鼻',tags:['可愛'],cost:5,pos:'nose',hit:14},
 {id:'mouth_w',name:'ω 嘴',tags:['可愛','好笑'],cost:5,pos:'mouth',hit:16},
 {id:'mouth_smile',name:'微笑',tags:['溫柔'],cost:5,pos:'mouth',hit:16},
 {id:'mouth_fang',name:'小尖牙',tags:['酷'],cost:8,pos:'mouth',hit:16},
 {id:'blush',name:'腮紅',tags:['可愛','溫柔'],cost:8,pos:'cheek',hit:56},
 {id:'bow',name:'蝴蝶結',tags:['可愛','高級'],cost:25,pos:'acc',hit:24},
 {id:'flower',name:'小花',tags:['溫柔','活潑'],cost:15,pos:'acc',hit:18},
 {id:'star',name:'星星補丁',tags:['活潑','手作感'],cost:15,pos:'body',hit:18},
 {id:'heart',name:'愛心補丁',tags:['可愛'],cost:12,pos:'body',hit:16},
 {id:'scar',name:'縫線疤痕',tags:['酷','手作感'],cost:10,pos:'body',hit:22},
 {id:'pin',name:'安全別針',tags:['酷'],cost:10,pos:'acc',hit:20},
 {id:'scarf',name:'格紋圍巾',tags:['復古','溫柔'],cost:30,pos:'neck',hit:50},
];
const DECOR_BY=Object.fromEntries(DECOR.map(d=>[d.id,d]));
const SOFT={
 soft:{label:'軟綿綿',range:[.35,.7]},
 full:{label:'飽滿',range:[.7,.95]},
 firm:{label:'硬挺',range:[.85,1.05]},
 any:{label:'都可以',range:[.3,1.05]},
};
const ORDERS=[
 {who:'林太太',emoji:'👩',text:'我女兒最近住院，晚上一個人會怕。想要一隻可以抱著睡、摸起來很安心的娃娃。',
  need:[{tag:'療癒',min:2},{tag:'溫柔',min:2}],soft:'soft',budget:220,
  lines:{good:'她一定會抱著它睡著的……真的謝謝你。',mid:'嗯，她應該會喜歡吧。',bad:'這個……好像不太適合放在病床上。'}},
 {who:'阿哲',emoji:'🧑‍🎤',text:'我們樂團要一隻吊在貝斯上的吉祥物。要酷！絕對不要可愛的東西，很遜。要硬挺一點，甩起來才不會軟趴趴。',
  need:[{tag:'酷',min:3},{tag:'可愛',max:1}],soft:'firm',budget:180,
  lines:{good:'靠，超酷！今晚就帶上台！',mid:'還行啦，勉強可以掛。',bad:'這掛上去我會被團員笑死。'}},
 {who:'陳奶奶',emoji:'👵',text:'我小時候有一隻手縫的娃娃，搬家時弄丟了。可以幫我做一隻有「以前那種味道」的嗎？軟硬都沒關係。',
  need:[{tag:'復古',min:3},{tag:'手作感',min:1}],soft:'any',budget:150,
  lines:{good:'哎呀……就是這個感覺，跟我那隻好像。',mid:'做得很用心，謝謝你啊。',bad:'現在的娃娃都長這樣啊……'}},
 {who:'小薇',emoji:'👩‍💼',text:'工作壓力好大，想要一隻放在辦公桌上、可以一直捏的娃娃。最好看了會想笑。',
  need:[{tag:'療癒',min:2},{tag:'好笑',min:2}],soft:'soft',budget:200,
  lines:{good:'哈哈哈哈它的臉！我今天不會想辭職了。',mid:'還不錯，捏起來滿舒服的。',bad:'看了……更累了。'}},
 {who:'甜點店老闆',emoji:'👨‍🍳',text:'我要一隻放在櫃檯的吉祥物，要活潑、讓客人心情好。可愛……但不要太可愛，我們不是兒童用品店。要飽滿一點，看起來才有精神。',
  need:[{tag:'活潑',min:2},{tag:'可愛',min:1,max:3}],soft:'full',budget:260,
  lines:{good:'完美！客人一定會跟它拍照。',mid:'嗯，放櫃檯應該可以。',bad:'這放出去，客人會以為我們走錯路線了。'}},
];
const STEPS=[['order','接單'],['material','設計'],['layout','排版'],['cut','裁布'],['sew','車縫'],['stuff','塞棉花'],['decor','裝飾'],['deliver','交件']];

// ===================== 工具 =====================
const D=Math.PI/180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function shade(h,amt){const[r,g,b]=hexRgb(h);const f=amt<0?0:255,k=Math.abs(amt);return`rgb(${Math.round(r+(f-r)*k)},${Math.round(g+(f-g)*k)},${Math.round(b+(f-b)*k)})`}
function lum(h){const[r,g,b]=hexRgb(h);return(.299*r+.587*g+.114*b)/255}
const pct=v=>Math.round(v*100)+'%';
function pip(P,x,y){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)c=!c}return c}
function bbox(P){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of P){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y)}return{x0,y0,x1,y1}}
function centroid(P){const b=bbox(P);return{x:(b.x0+b.x1)/2,y:(b.y0+b.y1)/2}}
function overlap(P,Q){const A=bbox(P),B=bbox(Q),x0=Math.max(A.x0,B.x0),x1=Math.min(A.x1,B.x1),y0=Math.max(A.y0,B.y0),y1=Math.min(A.y1,B.y1);
 if(x0>=x1||y0>=y1)return false;for(let y=y0;y<y1;y+=3)for(let x=x0;x<x1;x+=3)if(pip(P,x,y)&&pip(Q,x,y))return true;return false}
function rotV(x,y,a){const c=Math.cos(a),s=Math.sin(a);return{x:x*c-y*s,y:x*s+y*c}}

// ===================== 畫布 =====================
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=800,H=560,dpr=Math.min(2,window.devicePixelRatio||1);
cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
const CX=400,CY=320,R=108,LS=.5,FAB={x:40,y:110,w:720,h:230},BAG={x:100,y:470};
const EMOJI_FONT='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const UI_FONT='"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif';

function bumpProf(b,t){const[deg,,w,sharp]=b;const d=Math.abs(angDiff(t,deg*D));return sharp?Math.exp(-d/w):Math.exp(-((d/w)**2))}
function shapeR(sh,t){
 const p=sh.p||2,base=1/Math.pow(Math.abs(Math.cos(t)/sh.ax)**p+Math.abs(Math.sin(t)/sh.ay)**p,1/p);
 let k=1;for(const b of sh.bumps)k+=b[1]*bumpProf(b,t);return base*k;

 Object.entries(sides).forEach(([k,f])=>{if(f.length===2&&Math.abs(f[0]-f[1])>.35)comments.push(`兩邊的${S.parts[k].rname}一大一小耶。`)});

 const o=S.parts[key],P=partPoly(key,side),f=fab(key),c=centroid(P),fill=partFill(key,side);
 drawBody(P,f.mat,f.color.hex,Math.min(1,fill),c.x,c.y,R*.3,2.2);
 if(o.inner){const ip=innerPoly(key,side),fi=fab('earInner');drawBody(ip,fi.mat,fi.color.hex,Math.min(1,fill),c.x,c.y,R*.2,1.6)}
 if(showFX&&!o.nostuff){
  const rot=partXform(o,side).rot,ax=rotV(0,-1,rot),nx={x:-ax.y,y:ax.x};
  if(fill<.28){ctx.strokeStyle='rgba(70,40,30,.3)';ctx.lineWidth=1.5;ctx.lineCap='round';ctx.beginPath();for(const s of[-1,1]){ctx.moveTo(c.x+nx.x*s*5-ax.x*10,c.y+nx.y*s*5-ax.y*10);ctx.lineTo(c.x+nx.x*s*3+ax.x*10,c.y+nx.y*s*3+ax.y*10)}ctx.stroke()}
  if(fill>1.05){ctx.strokeStyle='rgba(208,83,74,.7)';ctx.lineWidth=2;ctx.beginPath();for(const s of[-1,1]){ctx.moveTo(c.x+nx.x*s*14,c.y+nx.y*s*14);ctx.lineTo(c.x+nx.x*s*22,c.y+nx.y*s*22)}ctx.stroke()}
 }
}
function threadColor(){return lum(fab('body').color.hex)>.55?shade(fab('body').color.hex,-.55):'#fff3e0'}
function drawStitches(){
 const sw=S.sew,st=sw.stitches.filter(s=>!s.bad).map(s=>toDoll(s.dx,s.dy));if(st.length<2)return;
 ctx.lineCap='round';ctx.lineWidth=2.2;ctx.strokeStyle=threadColor();ctx.beginPath();
 for(let i=0;i<st.length-1;i++){if(Math.floor(i/3)%2)continue;ctx.moveTo(st[i].x,st[i].y);ctx.lineTo(st[i+1].x,st[i+1].y)}ctx.stroke();
 ctx.lineWidth=3.2;ctx.beginPath();
 if(sw.backStart){ctx.moveTo(st[0].x,st[0].y);for(let i=1;i<Math.min(8,st.length);i++)ctx.lineTo(st[i].x,st[i].y)}
 if(sw.backEnd){const n=st.length;ctx.moveTo(st[n-1].x,st[n-1].y);for(let i=n-2;i>=Math.max(0,n-8);i--)ctx.lineTo(st[i].x,st[i].y)}ctx.stroke();
}
function drawBodyFX(){
 const regs=S.stuff.regs;if(!regs)return;const b=regs[0];
 if(b.fill<.28){ctx.strokeStyle='rgba(70,40,30,.28)';ctx.lineWidth=1.6;ctx.lineCap='round';for(const dy of[-25,5,35]){ctx.beginPath();ctx.moveTo(CX-35,CY+dy);ctx.quadraticCurveTo(CX,CY+dy+8,CX+35,CY+dy);ctx.stroke()}}
 if(b.lump>.12)[[.45,-.6],[.5,.9],[.35,2.2],[.5,3.6],[.4,5]].forEach(([rr,t])=>{const p=toDoll(Math.cos(t)*R*shapeR(S.body,t)*rr,Math.sin(t)*R*shapeR(S.body,t)*rr),s=10+b.lump*10;
  const g=ctx.createRadialGradient(p.x-s*.3,p.y-s*.3,1,p.x,p.y,s);g.addColorStop(0,`rgba(255,255,255,${.25*b.lump})`);g.addColorStop(.6,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(60,30,20,${.22*b.lump})`);ctx.fillStyle=g;circle(ctx,p.x,p.y,s);ctx.fill()});
 if(b.fill>1.05){ctx.strokeStyle='rgba(208,83,74,.7)';ctx.lineWidth=2;ctx.beginPath();[0,1.2,2.4,3.6,4.8].forEach(t=>{const q=toDoll(Math.cos(t)*R*shapeR(S.body,t),Math.sin(t)*R*shapeR(S.body,t)),dx=q.x-CX,dy=q.y-CY,l=Math.hypot(dx,dy);ctx.moveTo(q.x+dx/l*4,q.y+dy/l*4);ctx.lineTo(q.x+dx/l*12,q.y+dy/l*12)});ctx.stroke()}
}
const PART_KEYS=['ears','arms','feet'];
function activeParts(layer){const out=[];PART_KEYS.forEach(k=>{const o=S.parts[k];if(o.id!=='none'&&o.layer===layer)out.push(k)});return out}
function dollAllPoints(){let pts=dollOutline(120);activeParts('front').forEach(k=>[-1,1].forEach(s=>pts=pts.concat(partPoly(k,s))));return pts}
function groundShadow(pts){const b=bbox(pts);ctx.fillStyle='rgba(60,40,30,.16)';ell(ctx,(b.x0+b.x1)/2,b.y1+6,(b.x1-b.x0)*.42,13);ctx.fill()}
function drawDoll(now,{decor=true,sel=true,highlight=null}={}){
 const fx=!!S.stuff.regs,bf=fab('body');
 groundShadow(dollAllPoints());ctx.save();
 if(S.offGrain>=3&&bf.mat.id==='cotton'){ctx.translate(CX,CY);ctx.transform(1,0,-.06,1,0,0);ctx.translate(-CX,-CY)}
 activeParts('back').forEach(k=>[-1,1].forEach(s=>drawPart(k,s,fx)));
 const pts=dollOutline();drawBody(pts,bf.mat,bf.color.hex,Math.min(1,bodyFill()));
 if(S.parts.belly.id!=='none'){const bp=bellyPoly(),f=fab('belly'),c=centroid(bp);ctx.save();pathFrom(pts);ctx.clip();drawBody(bp,f.mat,f.color.hex,.3,c.x,c.y,R*.4,1.5);
  ctx.setLineDash([4,4]);ctx.strokeStyle=lum(f.color.hex)>.55?shade(f.color.hex,-.5):'#fff3e0';ctx.lineWidth=1.6;pathFrom(bp.map(p=>({x:c.x+(p.x-c.x)*.9,y:c.y+(p.y-c.y)*.9})));ctx.stroke();ctx.setLineDash([]);ctx.restore()}
 S.stains.forEach(s=>{const p=toDoll(s.dx,s.dy);drawStain(p.x,p.y,1.6)});
 drawStitches();drawBodyFX();
 activeParts('front').forEach(k=>[-1,1].forEach(s=>drawPart(k,s,fx)));
 if(highlight){ctx.setLineDash([6,5]);ctx.strokeStyle='#e07a5f';ctx.lineWidth=2.5;
  if(highlight==='body')pathFrom(dollOutline(120)),ctx.stroke();
  else if(highlight==='belly'){if(S.parts.belly.id!=='none'){pathFrom(bellyPoly());ctx.stroke()}}
  else{const k=highlight==='earInner'?'ears':highlight;if(S.parts[k].id!=='none')[-1,1].forEach(s=>{pathFrom(highlight==='earInner'?innerPoly(k,s):partPoly(k,s));ctx.stroke()})}
  ctx.setLineDash([])}
 if(decor)S.decor.forEach((it,i)=>{drawItem(it);if(sel&&i===S.sel){ctx.setLineDash([5,4]);ctx.strokeStyle='#e07a5f';ctx.lineWidth=2;circle(ctx,it.x,it.y,DECOR_BY[it.type].hit*it.s+4);ctx.stroke();ctx.setLineDash([])}});

}

// ===================== 排版 =====================
function grainOk(mat,r){const g=mat.grain;return g==='none'||(g==='two'&&r%2===0)||(g==='one'&&r===0)}
function buildUnits(){
 const U=[],sc=(P,k)=>P.map(p=>({x:p.x*R*k,y:p.y*R*k}));
 const add=(name,slot,mult,Ppx)=>{const b=bbox(Ppx),off={x:(b.x0+b.x1)/2,y:(b.y0+b.y1)/2};U.push({name,slot,mult,P:Ppx.map(p=>({x:p.x-off.x,y:p.y-off.y})),off,size:Math.max(b.x1-b.x0,b.y1-b.y0),x:0,y:0,rot:0})};
 add('身體','body',2,outline(S.body,1.06,120,0,0));
 const e=S.parts.ears;if(e.id!=='none'){add(e.rname==='角'?'小角':'耳朵','ears',4,sc(e.P,1.12));if(e.inner){const c=centroid(e.P);add('耳朵內側','earInner',2,e.P.map(p=>({x:(c.x+(p.x-c.x)*.6)*R,y:(c.y+(p.y-c.y)*.66)*R})))}}
 const a=S.parts.arms;if(a.id!=='none')add(a.rname,'arms',4,sc(a.P,1.12));
 const f=S.parts.feet;if(f.id!=='none')add('腳','feet',4,sc(f.P,1.12));
 const bl=S.parts.belly;if(bl.id!=='none')add('肚子','belly',1,sc(bl.P,1.06));
 return U;
}
function initLayout(){
 const units=buildUnits(),bolts=[],byKey={};
 units.forEach((u,i)=>{const f=fab(u.slot),k=fabKey(f);if(!byKey[k]){byKey[k]={key:k,mat:f.mat,color:f.color,units:[],flaws:[]};bolts.push(byKey[k])}u.bolt=bolts.indexOf(byKey[k]);byKey[k].units.push(i)});
 bolts.forEach(b=>{let x=50;b.units.forEach(i=>{const u=units[i],bb=bbox(u.P),w=Math.max((bb.x1-bb.x0)*LS,70);u.x=x+w/2;u.y=445;x+=w+18});
  for(let i=0;i<2;i++)b.flaws.push({x:FAB.x+50+Math.random()*420,y:FAB.y+25+Math.random()*(FAB.h-50)})});
 S.layout={units,bolts,cur:0,sel:-1,drag:null,check:null};layoutCheck();
}
function unitPoly(u){const a=u.rot*Math.PI/2;return u.P.map(p=>{const v=rotV(p.x*LS,p.y*LS,a);return{x:u.x+v.x,y:u.y+v.y}})}
function layoutCheck(){
 const L=S.layout,polys=L.units.map(unitPoly),uInfo=L.units.map((u,i)=>{const P=polys[i];return{inside:P.every(q=>q.x>=FAB.x&&q.x<=FAB.x+FAB.w&&q.y>=FAB.y&&q.y<=FAB.y+FAB.h),ov:false,flaws:L.bolts[u.bolt].flaws.filter(f=>pip(P,f.x,f.y)).length,grain:grainOk(L.bolts[u.bolt].mat,u.rot)}});
 const bInfo=L.bolts.map(b=>{for(let i=0;i<b.units.length;i++)for(let j=i+1;j<b.units.length;j++){const a=b.units[i],c=b.units[j];if(overlap(polys[a],polys[c])){uInfo[a].ov=uInfo[c].ov=true}}
  const allIn=b.units.every(i=>uInfo[i].inside),ov=b.units.some(i=>uInfo[i].ov);
  const len=allIn?Math.ceil((Math.max(...b.units.flatMap(i=>polys[i].map(q=>q.x)))-FAB.x+4)/10)*10:0;
  return{allIn,ov,valid:allIn&&!ov,len,cost:len/10*b.mat.p10}});
 L.check={polys,uInfo,bInfo,valid:bInfo.every(b=>b.valid),cost:bInfo.reduce((s,b)=>s+b.cost,0)};
}
function unitAt(p){const L=S.layout,ids=L.bolts[L.cur].units;for(let k=ids.length-1;k>=0;k--){const i=ids[k];if(pip(L.check.polys[i],p.x,p.y))return i}return-1}
function commitLayout(){
 const L=S.layout,ch=L.check;S.fabricCost=ch.cost;S.offGrain=ch.uInfo.filter(x=>!x.grain).length;
 S.stains=[];S.otherFlaws=0;
 L.units.forEach((u,i)=>{const fl=L.bolts[u.bolt].flaws.filter(f=>pip(ch.polys[i],f.x,f.y));
  if(u.slot==='body'){const a=-u.rot*Math.PI/2;fl.forEach(f=>{const v=rotV((f.x-u.x)/LS,(f.y-u.y)/LS,a);S.stains.push({dx:(v.x+u.off.x)/1.06,dy:(v.y+u.off.y)/1.06})})}
  else S.otherFlaws+=fl.length});
}

// ===================== 裁布 =====================
function curUnit(){return S.layout.units[S.cut.order[S.cut.which]]}
function resetCut(){
 const c=S.cut,u=curUnit(),a=u.rot*Math.PI/2;c.z=clamp(330/u.size,1,3);
 const P=u.P.length<200?resample(u.P,240):u.P;
 c.pts=P.map(p=>{const v=rotV(p.x*c.z,p.y*c.z,a);return{x:CX+v.x,y:CY+v.y}});c.cov=new Array(c.pts.length).fill(false);
 c.devSum=0;c.devN=0;c.off=0;c.trail=[];c.done=false;c.doneAt=0;
 c.flaws=S.layout.bolts[u.bolt].flaws.map(f=>({x:CX+(f.x-u.x)/LS*c.z,y:CY+(f.y-u.y)/LS*c.z})).filter(f=>f.x>130&&f.x<670&&f.y>80&&f.y<510);
}
function resample(P,n){const segs=[];let tot=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],l=dist(a,b);segs.push([a,b,l]);tot+=l}
 const out=[];let si=0,acc=0;for(let k=0;k<n;k++){const d=k/n*tot;while(acc+segs[si][2]<d&&si<segs.length-1){acc+=segs[si][2];si++}const[a,b,l]=segs[si],t=l?(d-acc)/l:0;out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t})}return out}
function cutCoverage(){return S.cut.cov.filter(Boolean).length/S.cut.cov.length}
function processCut(q){
 const c=S.cut;if(c.done)return;let bd=1e9;
 for(let k=0;k<c.pts.length;k++){const d=dist(q,c.pts[k]);if(d<15)c.cov[k]=true;if(d<bd)bd=d}
 if(bd<15){c.devSum+=bd;c.devN++}else if(bd<60)c.off++;
 c.trail.push({x:q.x,y:q.y,ok:bd<15});
 const now=performance.now();if(now-lastSfx>70){SFX.snip();lastSfx=now}
 if(cutCoverage()>=.97){c.done=true;c.doneAt=now;c.accs[c.which]=clamp(1-(c.devSum/Math.max(1,c.devN))/15-Math.min(.3,c.off*.002),0,1);c.acc=avg(c.accs.filter(x=>x!=null));SFX.pop();renderControls();renderSide(true)}
}

// ===================== 車縫 =====================
function resetSew(clearPins){
 const sw=S.sew,raw=outline(S.body,.9,320),g0=70*D,g1=110*D;
 const path=raw.filter(p=>!(p.t>g0&&p.t<g1)).map(p=>({...p,key:(p.t-g1+2*Math.PI)%(2*Math.PI)})).sort((a,b)=>a.key-b.key);
 for(let k=0;k<path.length;k++){const a=path[Math.max(0,k-3)],b=path[k],c=path[Math.min(path.length-1,k+3)];
  if(a===b||b===c){b.lim=.8;continue}
  const cur=Math.abs(angDiff(Math.atan2(c.y-b.y,c.x-b.x),Math.atan2(b.y-a.y,b.x-a.x)));b.lim=clamp(.8-cur*1.6,.25,.8)}
 // 有部件夾在縫線裡的地方，要放慢
 PART_KEYS.forEach(k=>{const o=S.parts[k];if(o.id==='none')return;[-1,1].forEach(s=>{const th=(-90+s*o.a)*D;path.forEach(p=>{if(Math.abs(angDiff(p.t,th))<10*D){p.lim=Math.min(p.lim,.4);p.part=true}})})});
 const pins=clearPins?[]:sw.pins.map(p=>({i:p.i,out:false}));
 Object.assign(sw,{phase:clearPins?'pin':'sew',pins,path,idx:0,stitches:[],jams:0,pinHits:0,drift:0,jamUntil:0,done:false,acc:0,flash:'',flashT:0,backStart:false,backEnd:false,backHold:false,backT:0});
}
const GAP=50;
function pinGaps(){const sw=S.sew,L=sw.path.length,ix=[0,...sw.pins.map(p=>p.i).sort((a,b)=>a-b),L-1],g=[];for(let i=0;i<ix.length-1;i++)if(ix[i+1]-ix[i]>GAP)g.push([ix[i],ix[i+1]]);return g}
function pinnedNear(i){const sw=S.sew;return i<8||i>sw.path.length-8||sw.pins.some(p=>Math.abs(p.i-i)<=GAP/2)}
function placePin(p){
 const sw=S.sew;let bi=-1,bd=1e9;sw.path.forEach((q,i)=>{const d=dist(p,q);if(d<bd){bd=d;bi=i}});
 if(bd>16)return;const ex=sw.pins.findIndex(x=>Math.abs(x.i-bi)<6);
 if(ex>=0)sw.pins.splice(ex,1);else sw.pins.push({i:bi,out:false});SFX.pop();
}
function pullPin(){const sw=S.sew,p=sw.pins.filter(p=>!p.out&&p.i>sw.idx-2&&p.i<=sw.idx+35).sort((a,b)=>a.i-b.i)[0];if(p){p.out=true;SFX.pop()}}
function processSew(q){
 const sw=S.sew,now=performance.now();if(sw.done||now<sw.jamUntil)return;
 let best=-1,bd=1e9;
 for(let j=sw.idx;j<Math.min(sw.path.length,sw.idx+14);j++){const d=dist(q,sw.path[j]);if(d<bd){bd=d;best=j}}
 if(bd>18)return;
 const lim=sw.path[sw.idx].lim;
 if(ptr.speed>lim){
  if(!sw.assist){sw.jamUntil=now+400;sw.jams++;flash(sw,sw.path[sw.idx].part?'這裡夾著部件，布比較厚，要放慢！':'跳針了！轉角要放慢');SFX.jam();
   sw.stitches.push({dx:q.x-CX,dy:q.y-CY,q:0,bad:true});return}
  best=Math.min(best,sw.idx+1);
 }
 if(best>sw.idx){
  const hit=sw.pins.find(p=>!p.out&&p.i>sw.idx&&p.i<=best);
  if(hit){hit.out=true;sw.pinHits++;sw.jamUntil=now+1200;flash(sw,'撞到珠針，斷針了！要先按空白鍵拔掉');SFX.jam();SFX.no();return}
  const dev={x:q.x-sw.path[best].x,y:q.y-sw.path[best].y};
  for(let k=sw.idx+1;k<=best;k++){
   sw.drift=pinnedNear(k)?Math.max(0,sw.drift-.3):Math.min(9,sw.drift+.09);
   const p=sw.path[k],nx=p.x-CX,ny=p.y-CY,nl=Math.hypot(nx,ny)||1;
   sw.stitches.push({dx:p.x-CX+dev.x*.8+nx/nl*sw.drift,dy:p.y-CY+dev.y*.8+ny/nl*sw.drift,q:clamp(1-(bd+sw.drift)/14,0,1),bad:false})}
  if(sw.drift>3&&!flashing(sw))flash(sw,'沒有珠針固定，布在滑動！');
  sw.idx=best;if(now-lastSfx>55){SFX.thunk();lastSfx=now}
 }
 if(sw.idx>=sw.path.length-1){sw.done=true;const good=sw.stitches.filter(s=>!s.bad);sw.acc=clamp(avg(good.map(s=>s.q))-sw.jams*.05-sw.pinHits*.06,0,1);SFX.pop();renderControls();renderSide(true)}
}

// ===================== 塞棉花 =====================
function regionsFor(){
 const regs=[{name:'身體',part:'body',side:0,fill:0,lump:0,early:false,small:false}];
 PART_KEYS.forEach(k=>{const o=S.parts[k];if(o.id==='none'||o.nostuff)return;
  [-1,1].forEach(s=>regs.push({name:(s<0?'左':'右')+o.rname,part:k,side:s,fill:0,lump:0,early:k!=='feet',small:true}))});
 return regs;
}
function regionAt(p){
 const regs=S.stuff.regs;if(!regs)return-1;
 for(let i=regs.length-1;i>0;i--){const r=regs[i];if(pip(partPoly(r.part,r.side),p.x,p.y))return i}
 return pip(dollOutline(120),p.x,p.y)?0:-1;
}
function openingPos(){return toDoll(0,R*shapeR(S.body,Math.PI/2)*.9)}
function dropClump(p){
 const st=S.stuff,cl=st.clump;st.clump=null;if(!cl)return;
 const ri=regionAt(p);if(ri<0){flash(st,'棉花掉到桌上了。');return}
 const r=st.regs[ri];
 if(r.small&&cl.size>1.4){flash(st,`太大團了，塞不進${r.name}！按短一點，拉小團的。`);SFX.no();return}
 if(r.early&&st.regs[0].fill>=.55){flash(st,`身體已經塞太滿，棉花推不到${r.name}了。末端要先塞！`);SFX.no();return}
 const f=fab(r.part==='body'?'body':r.part),gain=cl.size*.08*f.mat.stretch*(r.small?1.7:1),lm=(f.mat.id==='knit'&&S.offGrain)?1.4:1;
 r.fill=Math.min(1.35,r.fill+gain);r.lump=Math.min(1,r.lump+Math.max(0,cl.size-1)*.14*lm);st.squish=1;
 for(let i=0;i<8;i++)st.parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,r:4+Math.random()*4,l:1});
 SFX.puff();
}
function closePoints(){const op=openingPos();return[0,1,2,3,4].map(i=>({x:op.x-24+i*12,y:op.y}))}

const POS={eyes:[0,-.22],nose:[0,-.04],mouth:[0,.1],cheek:[0,0],acc:[.55,-.72],body:[-.3,.45],neck:[0,.36]};
function addDecor(id){
 const d=DECOR_BY[id],[px,py]=POS[d.pos],same=S.decor.filter(x=>DECOR_BY[x.type].pos===d.pos).length;
 S.decor.push({type:id,x:CX+px*R+same*12,y:CY+py*R+same*10,s:1,rot:0});S.sel=S.decor.length-1;SFX.pop();renderControls();renderSide(true);
}
function hitDecor(p){let best=-1,bs=1;S.decor.forEach((it,i)=>{const s=dist(p,it)/(DECOR_BY[it.type].hit*it.s);if(s<=bs){bs=s;best=i}});return best}

// ===================== 輸入 =====================
function toLocal(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{
 ensureAudio();cv.setPointerCapture(e.pointerId);const p=toLocal(e),right=e.button===2;
 Object.assign(ptr,{down:true,x:p.x,y:p.y,lastT:performance.now(),speed:0,inside:true});
 switch(S.step){
 case'material':{const k=pickPartAt(p);if(k){S.tab=k;SFX.pop();renderControls()}ptr.down=false;break}
 case'layout':{const L=S.layout,i=unitAt(p);L.sel=i;
  if(i>=0&&right){ACT.rot();ptr.down=false;break}
  if(i>=0){const u=L.units[i];L.drag={i,dx:p.x-u.x,dy:p.y-u.y}}renderControls();break}
 case'cut':S.cut.trail.push(null);processCut(p);break;
 case'sew':if(S.sew.phase==='pin'){placePin(p);ptr.down=false}else processSew(p);break;
 case'stuff':{const st=S.stuff;
  if(st.closing&&!st.closed){const cp=closePoints()[st.closeIdx];if(dist(p,cp)<18){st.closeIdx++;SFX.thunk();if(st.closeIdx>=5){st.closed=true;SFX.pop();renderControls()}}else flash(st,'點亮起來的那個縫點');break}
  if(st.closed)break;
  if(dist(p,BAG)<55){st.clump={size:.4,x:p.x,y:p.y};break}
  if(regionAt(p)>=0)st.kneadAt={x:p.x,y:p.y};break}
 case'decor':{const i=hitDecor(p);S.sel=i;if(i>=0){const it=S.decor[i];S.drag={dx:p.x-it.x,dy:p.y-it.y};S.decor.push(S.decor.splice(i,1)[0]);S.sel=S.decor.length-1}else S.drag=null;renderControls();break}
 }
});
function pickPartAt(p){
 if(S.parts.belly.id!=='none'&&pip(bellyPoly(),p.x,p.y))return'belly';
 for(const k of['feet','arms','ears']){const o=S.parts[k];if(o.id==='none')continue;for(const s of[-1,1]){if(o.inner&&pip(innerPoly(k,s),p.x,p.y))return'earInner';if(pip(partPoly(k,s),p.x,p.y))return k}}
 return pip(dollOutline(120),p.x,p.y)?'body':null;
}
cv.addEventListener('pointermove',e=>{
 const p=toLocal(e),now=performance.now(),dt=Math.max(1,now-ptr.lastT),prev={x:ptr.x,y:ptr.y},d=dist(p,prev);
 ptr.speed=ptr.speed*.55+(d/dt)*.45;ptr.lastT=now;ptr.lastMove=now;ptr.x=p.x;ptr.y=p.y;ptr.inside=true;
 if(!ptr.down)return;
 if(S.step==='cut'||S.step==='sew'){const steps=Math.max(1,Math.ceil(d/3));
  for(let i=1;i<=steps;i++){const q={x:prev.x+(p.x-prev.x)*i/steps,y:prev.y+(p.y-prev.y)*i/steps};S.step==='cut'?processCut(q):processSew(q)}}
 if(S.step==='layout'&&S.layout.drag){const L=S.layout,u=L.units[L.drag.i];u.x=clamp(p.x-L.drag.dx,0,W);u.y=clamp(p.y-L.drag.dy,0,H);layoutCheck()}
 if(S.step==='stuff'){const st=S.stuff;if(st.clump){st.clump.x=p.x;st.clump.y=p.y}
  else if(st.kneadAt){const ri=regionAt(p);if(ri>=0){const r=st.regs[ri];r.lump=Math.max(0,r.lump-d*.0012);st.squish=Math.min(1,st.squish+d*.01);if(now-lastSfx>120&&d>2){SFX.squish();lastSfx=now}}}}
 if(S.step==='decor'&&S.drag&&S.sel>=0){const it=S.decor[S.sel];it.x=clamp(p.x-S.drag.dx,0,W);it.y=clamp(p.y-S.drag.dy,0,H)}
});
const up=e=>{
 if(!ptr.down)return;ptr.down=false;if(!S)return;
 if(S.step==='stuff'){if(S.stuff.clump)dropClump(e?toLocal(e):ptr);S.stuff.kneadAt=null}
 if(S.step==='layout'&&S.layout.drag){S.layout.drag=null;layoutCheck();renderControls()}
 S.drag=null;
};

cv.addEventListener('wheel',e=>{if(S.step!=='decor'||S.sel<0)return;e.preventDefault();const it=S.decor[S.sel];it.s=clamp(it.s*(e.deltaY<0?1.08:1/1.08),.4,2.6)},{passive:false});

const ACT={
 accept(){setStep('material')},
 skip(){startOrder()},
 tab(slot){S.tab=slot;renderControls()},
 body(id){S.body=BODIES.find(b=>b.id===id);SFX.pop();renderControls()},
 part(id){const k=S.tab;S.parts[k]=PARTS[k].opts.find(o=>o.id===id);if(k==='ears'&&!S.parts.ears.inner&&S.tab==='earInner')S.tab='ears';SFX.pop();renderControls()},
 mat(id){const s=S.tab;if(s==='body')S.fab.body.mat=MAT_BY[id];else S.fab[s]={...(S.fab[s]||{}),mat:MAT_BY[id]};SFX.pop();renderControls();renderSide(true)},
 color(id){const s=S.tab;if(s==='body')S.fab.body.color=COLOR_BY[id];else S.fab[s]={...(S.fab[s]||{}),color:COLOR_BY[id]};SFX.pop();renderControls()},
 same(){const s=S.tab;if(s!=='body'){S.fab[s]=null;SFX.pop();renderControls()}},
 toLayout(){setStep('layout')},
 bolt(i){S.layout.cur=+i;S.layout.sel=-1;renderControls()},
 rot(){const L=S.layout;if(L.sel<0)return;const u=L.units[L.sel];u.rot=(u.rot+1)%4;SFX.pop();layoutCheck();renderControls()},
 toCut(){commitLayout();setStep('cut')},
 recut(){resetCut();renderControls()},
 nextPiece(){S.cut.which++;resetCut();renderControls()},
 toSew(){setStep('sew')},
 startSew(){S.sew.phase='sew';renderControls()},
 assist(){S.sew.assist=!S.sew.assist;renderControls()},
 resew(){resetSew(false);renderControls();renderSide(true)},
 toStuff(){setStep('stuff')},
 unstuff(){const b=S.stuff.regs[0];b.fill=Math.max(0,b.fill-.08);SFX.puff()},
 close(){S.stuff.closing=true;S.stuff.closeIdx=0;renderControls()},
 toDecor(){setStep('decor')},
 add(id){addDecor(id)},
 dz(a){if(S.sel<0)return;const it=S.decor[S.sel];
  if(a==='+')it.s=clamp(it.s*1.12,.4,2.6);if(a==='-')it.s=clamp(it.s/1.12,.4,2.6);if(a==='l')it.rot-=.2;if(a==='r')it.rot+=.2;
  if(a==='del'){S.decor.splice(S.sel,1);S.sel=-1;renderControls()}renderSide(true)},
 deliver(){setStep('deliver')},
 save(){const a=document.createElement('a');a.download=`娃娃_給${S.order.who}.png`;a.href=cv.toDataURL('image/png');a.click()},
 next(){startOrder()},
};

function update(dt,now){

 if(S.step==='sew'&&S.sew.phase==='sew'){const sw=S.sew;
  if(sw.backHold){const L=sw.path.length,zone=sw.idx>=2&&sw.idx<16?'start':sw.idx>L-16?'end':null;
   if(!zone){if(!flashing(sw))flash(sw,sw.idx<2?'先車幾針，再回針':'回針要在開頭或結尾做');sw.backT=0}
   else if((zone==='start'&&!sw.backStart)||(zone==='end'&&!sw.backEnd)){sw.backT+=dt;const n=Math.floor(sw.backT*8);if(n!==sw._bt){sw._bt=n;SFX.thunk()}
    if(sw.backT>=.6){zone==='start'?sw.backStart=true:sw.backEnd=true;sw.backT=0;flash(sw,'回針完成 ✔');SFX.pop();renderControls()}}
  }else sw.backT=0}
 if(S.step==='stuff'){const st=S.stuff;
  if(st.clump&&ptr.down&&dist(ptr,BAG)<60)st.clump.size=Math.min(3,st.clump.size+dt*1.5);
  if(!st.closed&&!(S.sew.backStart&&S.sew.backEnd)&&st.regs[0].fill>.7){st.regs[0].fill-=dt*.05;st.leaked=true}
  st.squish=Math.max(0,st.squish-dt*2.5);
  st.parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l-=dt*2.5});st.parts=st.parts.filter(p=>p.l>0);
  const cb=document.getElementById('closeBtn');if(cb)cb.disabled=st.regs[0].fill<.15;
 }
 if(S.step==='deliver'){S.confetti.forEach(p=>{p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.r+=.1;if(p.y>H-40)p.l-=dt*2});S.confetti=S.confetti.filter(p=>p.l>0)}

}
let lastT=performance.now(),sideT=0;
function loop(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;update(dt,now);render(now);if(now-sideT>250){renderSide();sideT=now}requestAnimationFrame(loop)}
startOrder();requestAnimationFrame(loop);
</script>
