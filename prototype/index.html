<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>娃娃工坊 原型</title>
<style>
:root{--bg:#f6efe6;--panel:#fffaf3;--ink:#4a3b32;--muted:#9a8778;--accent:#e07a5f;--accent2:#c9603f;--ok:#3d9a66;--bad:#d0534a;--line:#e6d8c6;--chip:#f3e8da}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
header{max-width:1180px;margin:0 auto;padding:14px 16px 4px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:20px;margin:0;white-space:nowrap}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{padding:4px 11px;border-radius:999px;background:#ece0d0;color:var(--muted);font-size:13px}
.step.on{background:var(--accent);color:#fff;font-weight:bold}
.step.done{background:#d7ead9;color:#3d7a4f}
main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;max-width:1180px;margin:0 auto;padding:10px 16px 40px}
@media(max-width:880px){main{grid-template-columns:1fr}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;min-width:0}
canvas{width:100%;height:auto;display:block;border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none}
#controls{padding:10px 4px 2px}
#status{font-size:15px;line-height:1.6;min-height:24px;margin-bottom:8px;color:var(--ink)}
#status .warn{color:var(--bad);font-weight:bold}
#status .tip{color:var(--muted);font-size:13px}
.group{margin:6px 0 10px}
.group h4{margin:0 0 6px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid transparent;background:var(--chip);border-radius:10px;padding:6px 9px;cursor:pointer;font:inherit;font-size:14px;color:var(--ink);text-align:left;display:flex;flex-direction:column;gap:2px;min-width:70px;max-width:230px}
.chip:hover{border-color:#e9c9a8}
.chip.on{border-color:var(--accent);background:#fff1e8}
.chip b{font-size:14px}
.chip em{font-style:normal;color:var(--accent2);font-size:12px}
.chip small{font-size:11.5px;color:#a08b79;line-height:1.4}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;border-bottom:2px solid var(--line);padding-bottom:6px}
.tab{border:none;background:none;font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:6px}
.tab.on{background:var(--accent);color:#fff;font-weight:bold}
.tab .sw{margin:0}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:4px;border:1px solid rgba(0,0,0,.15)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.btn{border:none;border-radius:10px;padding:9px 16px;font:inherit;font-size:15px;cursor:pointer;background:var(--chip);color:var(--ink);user-select:none}
.btn:hover{filter:brightness(.97)}
.btn.main{background:var(--accent);color:#fff;font-weight:bold}
.btn.main:hover{background:var(--accent2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 11px;font-size:13px}
.btn.on{outline:2px solid var(--accent)}
.sliders{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 18px;background:#fbf3e9;border:1px dashed #e2cdb6;border-radius:10px;padding:8px 12px;margin:6px 0 10px}
.sliders label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.sliders label span{width:78px;flex:none}
.sliders input{flex:1;accent-color:var(--accent);min-width:0}
.sliders .foot{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.adj{background:#fbf3e9;border:1px dashed #e2cdb6;border-radius:10px;padding:6px 10px;margin:6px 0 10px;font-size:13px;color:var(--muted)}
.adj .row{margin-top:4px}
kbd{background:#fff;border:1px solid #d9c8b4;border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px;font-family:inherit}
aside{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card h3{margin:0 0 8px;font-size:15px}
.who{font-size:17px;font-weight:bold;display:flex;align-items:center;gap:8px}
.who .em{font-size:30px}
.quote{font-size:14.5px;line-height:1.7;margin:8px 0;color:#6a574a}
.check{list-style:none;padding:0;margin:0;font-size:14px}
.check li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.check li:last-child{border-bottom:none}
.y{color:var(--ok);font-weight:bold}.n{color:var(--bad);font-weight:bold}.q{color:var(--muted)}
.wallet{display:flex;justify-content:space-between;font-size:14px}
.tips{font-size:12.5px;line-height:1.7;color:var(--muted)}
.bars{font-size:14px;margin:4px 0 8px}
.bar{display:grid;grid-template-columns:86px 1fr 44px;gap:8px;align-items:center;margin:4px 0}
.bar i{display:block;height:9px;border-radius:5px;background:#eadccb;overflow:hidden}
.bar i b{display:block;height:100%;background:var(--accent)}
.comments{font-size:14px;line-height:1.7;margin:6px 0;padding-left:18px}
.review{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;font-size:13.5px}
.review span{background:var(--chip);border-radius:8px;padding:3px 9px}
</style>
</head>
<body>
<header>
  <h1>🧸 娃娃工坊 <small style="font-size:12px;color:var(--muted);font-weight:normal">原型 v0.6</small></h1>
  <div class="steps" id="steps"></div>
</header>

<script>
// ===================== 幾何小工具（資料會用到） =====================
function ellPoly(cx,cy,rx,ry,n=40){const p=[];for(let i=0;i<n;i++){const t=i/n*2*Math.PI;p.push({x:cx+Math.cos(t)*rx,y:cy+Math.sin(t)*ry})}return p}
function qbez(a,c,b,n,out){for(let i=0;i<n;i++){const t=i/n,u=1-t;out.push({x:u*u*a.x+2*u*t*c.x+t*t*b.x,y:u*u*a.y+2*u*t*c.y+t*t*b.y})}}
function pointyPoly(w,h){const o=[];qbez({x:-w,y:.05},{x:-w*.9,y:-h*.55},{x:0,y:-h},14,o);qbez({x:0,y:-h},{x:w*.9,y:-h*.55},{x:w,y:.05},14,o);qbez({x:w,y:.05},{x:0,y:.12},{x:-w,y:.05},8,o);return o}
function hornPoly(w,h){const o=[];qbez({x:-w,y:.04},{x:-w*.7,y:-h*.6},{x:w*.35,y:-h},12,o);qbez({x:w*.35,y:-h},{x:w*.15,y:-h*.45},{x:w,y:.04},12,o);qbez({x:w,y:.04},{x:0,y:.1},{x:-w,y:.04},6,o);return o}
function wingPoly(){const o=[];qbez({x:-.08,y:.02},{x:-.26,y:-.36},{x:.06,y:-.44},12,o);qbez({x:.06,y:-.44},{x:.26,y:-.32},{x:.13,y:-.2},8,o);qbez({x:.13,y:-.2},{x:.25,y:-.1},{x:.08,y:-.01},8,o);qbez({x:.08,y:-.01},{x:0,y:.07},{x:-.08,y:.02},6,o);return o}
function heartPoly(s,dy){const o=[];for(let i=0;i<60;i++){const t=i/60*2*Math.PI,x=16*Math.sin(t)**3,y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));o.push({x:x/17*s,y:y/17*s+dy})}return o}

// ===================== 資料 =====================

const TAGS=['可愛','溫柔','活潑','酷','復古','療癒','高級','好笑','手作感'];

 {id:'fluffy',name:'炸毛',tags:['活潑','好笑'],side:22,bang:-.18,bs:'zig',back:null,fluff:.08},
 {id:'twin',name:'雙馬尾',tags:['可愛','活潑'],side:25,bang:-.1,bs:'curve',back:'twin',fluff:0},

const PARTS={

  {id:'long',name:'長耳',tags:['可愛','溫柔'],a:20,inset:.1,tilt:-6,layer:'back',inner:true,rname:'耳',poly:()=>ellPoly(0,-.5,.17,.56)},

  {id:'horn',name:'小角',tags:['酷'],a:32,inset:.06,tilt:-6,layer:'back',inner:false,rname:'角',poly:()=>hornPoly(.15,.42)},
 ]},

  {id:'long',name:'長腿',tags:['好笑'],a:156,inset:.1,down:true,layer:'front',rname:'腳',poly:()=>ellPoly(0,-.32,.11,.34)},
 ]},
 belly:{label:'肚子',opts:[

  {id:'oval',name:'圓肚',tags:['療癒'],poly:()=>ellPoly(0,.3,.42,.36)},

Object.values(PARTS).forEach(g=>g.opts.forEach(o=>{if(o.poly)o.P=o.poly()}));
const PART_KEYS=['ears','arms','feet'];
const TABS={animal:[['body','身體'],['ears','耳朵'],['earInner','耳朵內側'],['arms','手'],['feet','腳'],['belly','肚子']],
 human:[['head','頭'],['body','身體'],['hair','頭髮'],['ears','屬性耳'],['earInner','耳朵內側']]};

 {id:'felt',name:'不織布',tags:['手作感','復古'],p10:1,gloss:.25,stretch:.8,grain:'none',desc:'沒有布紋，怎麼排都行。硬挺，有一種古早的手工味。'},
 {id:'cotton',name:'印花棉布',tags:['活潑','可愛'],p10:2,gloss:.5,stretch:1,grain:'two',desc:'有布紋（可上下顛倒）。花色明亮，看了心情好。'},

 {id:'minky',name:'短絨毛',tags:['療癒','高級'],p10:3,gloss:.9,stretch:1.1,grain:'one',desc:'毛有順向，不能顛倒排。摸起來像雲一樣。'},
];
const COLORS=[

 {id:'skin',name:'膚色',hex:'#f7dcc6',tags:['溫柔']},

const MAT_BY=Object.fromEntries(MATERIALS.map(m=>[m.id,m])),COLOR_BY=Object.fromEntries(COLORS.map(c=>[c.id,c]));
const DECOR=[
 {id:'eyes_button',name:'鈕扣眼',tags:['復古','手作感'],cost:15,pos:'eyes',hit:40},
 {id:'eyes_stitch',name:'刺繡瞇瞇眼',tags:['溫柔','療癒'],cost:10,pos:'eyes',hit:40},

 {id:'eyes_sparkle',name:'閃亮大眼',tags:['可愛','高級'],cost:30,pos:'eyes',hit:42},

 {id:'blush',name:'腮紅',tags:['可愛','溫柔'],cost:8,pos:'cheek',hit:56},

 {id:'star',name:'星星補丁',tags:['活潑','手作感'],cost:15,pos:'body',hit:18},

// ----- 衣服 -----
// 身形 = 尺寸 × 體型；衣服的版型依身形決定，只有同身形的娃娃穿得下

const GTYPES=[
 {id:'top',name:'上衣',piece:'衣身',slot:'top',mult:2,sizeBy:'body',anchor:'torso',cat:'cloth',tags:[],params:[['sleeve','袖長',0,1,.5],['len','衣長',0,1,.45],['loose','寬鬆',1.02,1.25,1.08]]},

 {id:'cape',name:'斗篷',piece:'斗篷',slot:'outer',mult:1,sizeBy:'body',anchor:'torso',cat:'cloth',tags:['復古','高級'],params:[['len','長度',0,1,.5],['width','寬度',0,1,.5]]},
 {id:'beanie',name:'毛帽',piece:'帽片',slot:'hat',mult:2,sizeBy:'head',anchor:'head',cat:'acc',tags:['溫柔'],params:[['depth','帽深',0,1,.5],['pom','毛球',0,1,1]]},
 {id:'beret',name:'貝雷帽',piece:'帽片',slot:'hat',mult:2,sizeBy:'head',anchor:'head',cat:'acc',tags:['高級','復古'],params:[['size','大小',0,1,.5],['tilt','歪斜',0,1,.75]]},
 {id:'hairband',name:'髮帶',piece:'髮帶',slot:'band',mult:1,sizeBy:'none',anchor:'head',cat:'acc',tags:['可愛'],params:[['thick','粗細',0,1,.5]]},

const GT_BY=Object.fromEntries(GTYPES.map(g=>[g.id,g]));
const GTRIMS=['lace','button1','pocket','bow','flower','star','heart'];
const CLOTH_ORDERS=[
 {type:'cloth',who:'美玲',emoji:'👩‍🦰',text:'這是我的娃娃「圓圓」，20cm 胖胖體。下個月她要當伴娘，幫她做一件正式又有點可愛的衣服，但不要太花俏。',
  doll:{torso:{w:1.4},hair:'hime',hairColor:'cocoa',skin:'skin',decor:['eyes_sparkle','mouth_smile','blush']},
  need:[{tag:'高級',min:2},{tag:'可愛',min:1,max:3}],budget:120,

 for(let i=0;i<=48;i++){const t=t0+(t1-t0)*i/48;cap.push(at(t,1.08+(h.fluff?h.fluff*Math.abs(Math.sin(t*9)):0)))}

 const by=m.cy+h.bang*r,bx=r*.8,N=24;
 for(let i=0;i<=N;i++){const u=1-2*i/N;let y=by;
  if(h.bs==='curve')y+=.1*r*(1-u*u);else if(h.bs==='zig')y+=.08*r*Math.abs(Math.sin(u*Math.PI*2.5));else if(h.bs==='part')y-=.16*r*(1-Math.abs(u));else y+=.02*r;
  cap.push({x:m.cx+u*bx,y})}

 let back=null,tails=null;
 if(h.back==='long'){back=[];for(let i=0;i<=30;i++)back.push(at((160+i/30*220)*D,1.12));const y2=m.cy+1.45*r;back.push({x:m.cx+1.02*r,y:y2-.2*r},{x:m.cx+.7*r,y:y2},{x:m.cx-.7*r,y:y2},{x:m.cx-1.02*r,y:y2-.2*r})}

}

function grainOk(mat,r){const g=mat.grain;return g==='none'||(g==='two'&&r%2===0)||(g==='one'&&r===0)}
function buildUnits(){
 const U=[],sc=(P,k)=>P.map(p=>({x:p.x*R*k,y:p.y*R*k}));
 const add=(name,slot,mult,Ppx,mid)=>{const b=bbox(Ppx),off={x:(b.x0+b.x1)/2,y:(b.y0+b.y1)/2};U.push({name,slot,mult,main:mid,P:Ppx.map(p=>({x:p.x-off.x,y:p.y-off.y})),off,size:Math.max(b.x1-b.x0,b.y1-b.y0),x:0,y:0,rot:0})};
 if(S.mode==='garment'){const g=S.g,c=gctx(),P=garmentPoly(g,c),ce=centroid(P),T=GT_BY[g.type];add(T.piece,'garment',T.mult,resample(P,160).map(p=>({x:p.x-ce.x,y:p.y-ce.y})),null);return U}
 mains().slice().reverse().forEach(m=>add(m.name,'body',2,outline(m.sh,1.06*m.r/R,120,0,0),m.id));
 const hg=hairGeo();if(hg){const rel=P=>P.map(p=>({x:p.x-hg.m.cx,y:p.y-hg.m.cy}));add('瀏海','hair',1,rel(hg.cap));if(hg.back)add('後髮','hair',1,rel(hg.back));if(hg.tails)add('馬尾','hair',2,rel(hg.tails[0]))}
 const pk=key=>Math.max(adjOf(key,-1).scale,adjOf(key,1).scale)*getMain(hostOf(key)).r/R;
 const e=S.parts.ears;if(e.id!=='none'){const k=pk('ears');add(e.rname==='角'?'小角':'耳朵','ears',4,sc(e.P,1.12*k));if(e.inner){const c=centroid(e.P);add('耳朵內側','earInner',2,e.P.map(p=>({x:(c.x+(p.x-c.x)*.6)*R*k,y:(c.y+(p.y-c.y)*.66)*R*k})))}}
 const a=S.parts.arms;if(a.id!=='none')add(a.rname,'arms',4,sc(a.P,1.12*pk('arms')));
 const f=S.parts.feet;if(f.id!=='none')add('腳','feet',4,sc(f.P,1.12*pk('feet')));
 const bl=S.parts.belly;if(bl.id!=='none')add('肚子','belly',1,sc(bl.P,1.06*((S.adj.belly||{}).scale||1)));
 return U;
}
function initLayout(){
 const units=buildUnits(),bolts=[],byKey={};
 units.forEach((u,i)=>{const f=fab(u.slot),k=fabKey(f);if(!byKey[k]){byKey[k]={key:k,mat:f.mat,color:f.color,units:[],flaws:[]};bolts.push(byKey[k])}u.bolt=bolts.indexOf(byKey[k]);byKey[k].units.push(i)});
 bolts.forEach(b=>{let x=50;b.units.forEach(i=>{const u=units[i],bb=bbox(u.P),w=Math.max((bb.x1-bb.x0)*LS,70);u.x=x+w/2;u.y=445;x+=w+18});
  for(let i=0;i<2;i++)b.flaws.push({x:FAB.x+50+Math.random()*420,y:FAB.y+25+Math.random()*(FAB.h-50)})});
 S.layout={units,bolts,cur:0,sel:-1,drag:null,check:null};layoutCheck();
}
function unitPoly(u){const a=u.rot*Math.PI/2;return u.P.map(p=>{const v=rotV(p.x*LS,p.y*LS,a);return{x:u.x+v.x,y:u.y+v.y}})}
function layoutCheck(){
 const L=S.layout,polys=L.units.map(unitPoly),uInfo=L.units.map((u,i)=>{const P=polys[i];return{inside:P.every(q=>q.x>=FAB.x&&q.x<=FAB.x+FAB.w&&q.y>=FAB.y&&q.y<=FAB.y+FAB.h),ov:false,flaws:L.bolts[u.bolt].flaws.filter(f=>pip(P,f.x,f.y)).length,grain:grainOk(L.bolts[u.bolt].mat,u.rot)}});
 const bInfo=L.bolts.map(b=>{for(let i=0;i<b.units.length;i++)for(let j=i+1;j<b.units.length;j++){const a=b.units[i],c=b.units[j];if(overlap(polys[a],polys[c])){uInfo[a].ov=uInfo[c].ov=true}}
  const allIn=b.units.every(i=>uInfo[i].inside),ov=b.units.some(i=>uInfo[i].ov);
  const len=allIn?Math.ceil((Math.max(...b.units.flatMap(i=>polys[i].map(q=>q.x)))-FAB.x+4)/10)*10:0;
  return{allIn,ov,valid:allIn&&!ov,len,cost:len/10*b.mat.p10}});
 L.check={polys,uInfo,bInfo,valid:bInfo.every(b=>b.valid),cost:bInfo.reduce((s,b)=>s+b.cost,0)};
}
function unitAt(p){const L=S.layout,ids=L.bolts[L.cur].units;for(let k=ids.length-1;k>=0;k--){const i=ids[k];if(pip(L.check.polys[i],p.x,p.y))return i}return-1}
function commitLayout(){
 const L=S.layout,ch=L.check;S.fabricCost=ch.cost;S.offGrain=ch.uInfo.filter(x=>!x.grain).length;
 S.stains=[];S.otherFlaws=0;
 L.units.forEach((u,i)=>{const fl=L.bolts[u.bolt].flaws.filter(f=>pip(ch.polys[i],f.x,f.y));
  if(u.slot==='body'&&u.main){const a=-u.rot*Math.PI/2;fl.forEach(f=>{const v=rotV((f.x-u.x)/LS,(f.y-u.y)/LS,a);S.stains.push({mid:u.main,dx:(v.x+u.off.x)/1.06,dy:(v.y+u.off.y)/1.06})})}
  else S.otherFlaws+=fl.length});
}

// ===================== 裁布 =====================
function curUnit(){return S.layout.units[S.cut.order[S.cut.which]]}
function resample(P,n){const segs=[];let tot=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length],l=dist(a,b);segs.push([a,b,l]);tot+=l}
 const out=[];let si=0,acc=0;for(let k=0;k<n;k++){const d=k/n*tot;while(acc+segs[si][2]<d&&si<segs.length-1){acc+=segs[si][2];si++}const[a,b,l]=segs[si],t=l?(d-acc)/l:0;out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t})}return out}
function resetCut(){
 const c=S.cut,u=curUnit(),a=u.rot*Math.PI/2;c.z=clamp(330/u.size,1,3);
 c.pts=resample(u.P,240).map(p=>{const v=rotV(p.x*c.z,p.y*c.z,a);return{x:CX+v.x,y:CY+v.y}});c.cov=new Array(c.pts.length).fill(false);
 c.devSum=0;c.devN=0;c.off=0;c.trail=[];c.done=false;c.doneAt=0;
 c.flaws=S.layout.bolts[u.bolt].flaws.map(f=>({x:CX+(f.x-u.x)/LS*c.z,y:CY+(f.y-u.y)/LS*c.z})).filter(f=>f.x>130&&f.x<670&&f.y>80&&f.y<510);
}
function cutCoverage(){return S.cut.cov.filter(Boolean).length/S.cut.cov.length}
function processCut(q){
 const c=S.cut;if(c.done)return;let bd=1e9;
 for(let k=0;k<c.pts.length;k++){const d=dist(q,c.pts[k]);if(d<15)c.cov[k]=true;if(d<bd)bd=d}
 if(bd<15){c.devSum+=bd;c.devN++}else if(bd<60)c.off++;
 c.trail.push({x:q.x,y:q.y,ok:bd<15});
 const now=performance.now();if(now-lastSfx>70){SFX.snip();lastSfx=now}
 if(cutCoverage()>=.97){c.done=true;c.doneAt=now;c.accs[c.which]=clamp(1-(c.devSum/Math.max(1,c.devN))/15-Math.min(.3,c.off*.002),0,1);c.acc=avg(c.accs.filter(x=>x!=null));SFX.pop();renderControls();renderSide(true)}
}

// ===================== 車縫（每個主體一條縫線） =====================
// 從一圈有順序的點做縫線：開口（gapDeg 方向）不車，從開口後面開始車到開口前面
function seamFromPts(id,name,pts,cx,cy,gapDeg,halfDeg=20){
 const g=gapDeg*D,H=halfDeg*D,n=pts.length,inc=pts.map(p=>Math.abs(angDiff(Math.atan2(p.y-cy,p.x-cx),g))>=H);
 let best=0,bs=0;for(let s=0;s<n;s++){if(inc[s]&&!inc[(s-1+n)%n]){let l=0;while(l<n&&inc[(s+l)%n])l++;if(l>best){best=l;bs=s}}}
 if(!best){best=n;bs=0}
 const path=[];for(let k=0;k<best;k++){const p=pts[(bs+k)%n];path.push({x:p.x,y:p.y,t:Math.atan2(p.y-cy,p.x-cx)})}
 for(let k=0;k<path.length;k++){const a=path[Math.max(0,k-3)],b=path[k],c=path[Math.min(path.length-1,k+3)];
  if(a===b||b===c){b.lim=.8;continue}
  const cur=Math.abs(angDiff(Math.atan2(c.y-b.y,c.x-b.x),Math.atan2(b.y-a.y,b.x-a.x)));b.lim=clamp(.8-cur*1.6,.25,.8)}
 return{mid:id,name,cx,cy,phase:'pin',pins:[],path,idx:0,stitches:[],jams:0,pinHits:0,drift:0,jamUntil:0,done:false,acc:0,backStart:false,backEnd:false};
}
function makeSeam(m){
 const sw=seamFromPts(m.id,m.name,outline(m.sh,.9*m.r/R,320,m.cx,m.cy),m.cx,m.cy,m.gap);
 activeParts().filter(k=>hostOf(k)===m.id).forEach(k=>[-1,1].forEach(s=>{const th=(-90+s*adjOf(k,s).a)*D;sw.path.forEach(p=>{if(Math.abs(angDiff(p.t,th))<10*D){p.lim=Math.min(p.lim,.4);p.part=true}})}));
 return sw;
}
function garmentSeam(){const P=resample(garmentPoly(S.g,gctx()),320),c=centroid(P);
 return seamFromPts('garment',GT_BY[S.g.type].name,P.map(p=>({x:c.x+(p.x-c.x)*.93,y:c.y+(p.y-c.y)*.93})),c.x,c.y,90,25)}
function seamFor(id){return id==='garment'?garmentSeam():makeSeam(getMain(id))}
function resetSew(){Object.assign(S.sew,{list:S.mode==='garment'?[garmentSeam()]:mains().slice().reverse().map(makeSeam),cur:0,flash:'',flashT:0,backHold:false,backT:0})}
const SW=()=>S.sew.list[S.sew.cur];
const swMain=sw=>({cx:sw.cx,cy:sw.cy});
const GAP=50;
function pinGaps(){const sw=SW(),L=sw.path.length,ix=[0,...sw.pins.map(p=>p.i).sort((a,b)=>a-b),L-1],g=[];for(let i=0;i<ix.length-1;i++)if(ix[i+1]-ix[i]>GAP)g.push([ix[i],ix[i+1]]);return g}
function pinnedNear(i){const sw=SW();return i<8||i>sw.path.length-8||sw.pins.some(p=>Math.abs(p.i-i)<=GAP/2)}
function placePin(p){
 const sw=SW();let bi=-1,bd=1e9;sw.path.forEach((q,i)=>{const d=dist(p,q);if(d<bd){bd=d;bi=i}});
 if(bd>16)return;const ex=sw.pins.findIndex(x=>Math.abs(x.i-bi)<6);
 if(ex>=0)sw.pins.splice(ex,1);else sw.pins.push({i:bi,out:false});SFX.pop();
}
function pullPin(){const sw=SW(),p=sw.pins.filter(p=>!p.out&&p.i>sw.idx-2&&p.i<=sw.idx+35).sort((a,b)=>a.i-b.i)[0];if(p){p.out=true;SFX.pop()}}
function processSew(q){
 const sw=SW(),m=swMain(sw),now=performance.now();if(sw.done||now<sw.jamUntil)return;
 let best=-1,bd=1e9;
 for(let j=sw.idx;j<Math.min(sw.path.length,sw.idx+14);j++){const d=dist(q,sw.path[j]);if(d<bd){bd=d;best=j}}
 if(bd>18)return;
 const lim=sw.path[sw.idx].lim;
 if(ptr.speed>lim){
  if(!S.sew.assist){sw.jamUntil=now+400;sw.jams++;flash(S.sew,sw.path[sw.idx].part?'這裡夾著部件，布比較厚，要放慢！':'跳針了！轉角要放慢');SFX.jam();
   sw.stitches.push({dx:q.x-m.cx,dy:q.y-m.cy,q:0,bad:true});return}
  best=Math.min(best,sw.idx+1);
 }
 if(best>sw.idx){
  const hit=sw.pins.find(p=>!p.out&&p.i>sw.idx&&p.i<=best);
  if(hit){hit.out=true;sw.pinHits++;sw.jamUntil=now+1200;flash(S.sew,'撞到珠針，斷針了！要先按空白鍵拔掉');SFX.jam();SFX.no();return}
  const dev={x:q.x-sw.path[best].x,y:q.y-sw.path[best].y};
  for(let k=sw.idx+1;k<=best;k++){
   sw.drift=pinnedNear(k)?Math.max(0,sw.drift-.3):Math.min(9,sw.drift+.09);
   const p=sw.path[k],nx=p.x-m.cx,ny=p.y-m.cy,nl=Math.hypot(nx,ny)||1;
   sw.stitches.push({dx:nx+dev.x*.8+nx/nl*sw.drift,dy:ny+dev.y*.8+ny/nl*sw.drift,q:clamp(1-(bd+sw.drift)/14,0,1),bad:false})}
  if(sw.drift>3&&!flashing(S.sew))flash(S.sew,'沒有珠針固定，布在滑動！');
  sw.idx=best;if(now-lastSfx>55){SFX.thunk();lastSfx=now}
 }
 if(sw.idx>=sw.path.length-1){sw.done=true;const good=sw.stitches.filter(s=>!s.bad);sw.acc=clamp(avg(good.map(s=>s.q))-sw.jams*.05-sw.pinHits*.06,0,1);SFX.pop();renderControls();renderSide(true)}
}

// ===================== 塞棉花 =====================
function regionsFor(){
 const regs=[];
 mains().forEach(m=>{regs.push({name:m.name,main:m.id,fill:0,lump:0,early:false,small:false});
  (m.sh.bumps||[]).forEach(b=>{if(b[4])regs.push({name:b[4],main:m.id,bump:b,fill:0,lump:0,early:Math.abs(angDiff(b[0]*D,m.gap*D))>60*D,small:true})})});
 activeParts().forEach(k=>{const o=S.parts[k];if(o.nostuff)return;
  [-1,1].forEach(s=>regs.push({name:(s<0?'左':'右')+o.rname,part:k,side:s,host:hostOf(k),fill:0,lump:0,early:k!=='feet',small:true}))});
 return regs;
}
const mainReg=mid=>S.stuff.regs.find(r=>r.main===mid&&!r.bump);
function regionAt(p){
 const regs=S.stuff.regs;if(!regs)return-1;
 for(let i=regs.length-1;i>=0;i--){const r=regs[i];if(r.part&&pip(partPoly(r.part,r.side),p.x,p.y))return i}
 for(const m of mains().slice().reverse()){if(!pip(mOutline(m,1,120),p.x,p.y))continue;
  const t=Math.atan2(p.y-m.cy,p.x-m.cx),rr=dist(p,{x:m.cx,y:m.cy})/(m.r*shapeR(m.sh,t)*radiusScale(m,t));
  let bi=-1,bw=0;regs.forEach((r,i)=>{if(r.main===m.id&&r.bump){const w=bumpProf(r.bump,t);if(w>bw){bw=w;bi=i}}});
  if(bi>=0&&bw>.3&&rr>.45)return bi;return regs.indexOf(mainReg(m.id))}
 return-1;
}
function openingPos(){
 if(S.kind==='human'){const h=getMain('head');return toDoll(h,0,h.r*shapeR(h.sh,Math.PI/2)*.97)}

function dropClump(p){

 const r=st.regs[ri],host=mainReg(r.part?r.host:r.main);
 if(r.small&&cl.size>1.4){flash(st,`太大團了，塞不進${r.name}！按短一點，拉小團的。`);SFX.no();return}
 if(r.early&&host.fill>=.55){flash(st,`${host.name}已經塞太滿，棉花推不到${r.name}了。末端要先塞！`);SFX.no();return}
 const f=r.part?fab(r.part):fab('body'),gain=cl.size*.08*f.mat.stretch*(r.small?1.7:1),lm=(f.mat.id==='knit'&&S.offGrain)?1.4:1;
 r.fill=Math.min(1.35,r.fill+gain);r.lump=Math.min(1,r.lump+Math.max(0,cl.size-1)*.14*lm);st.squish=1;
 for(let i=0;i<8;i++)st.parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,r:4+Math.random()*4,l:1});

const POS_H={eyes:['head',0,.14],nose:['head',0,.27],mouth:['head',0,.38],cheek:['head',0,.3],acc:['head',.62,-.55],body:['torso',-.15,.05],neck:['torso',0,-.62]};

function pickAt(p){
 const t=S.tab;if(PART_KEYS.includes(t)&&S.parts[t].id!=='none')for(const s of[-1,1])if(pip(partPoly(t,s),p.x,p.y))return{tab:t,key:t,side:s};
 for(const k of activeParts('front'))for(const s of[-1,1])if(pip(partPoly(k,s),p.x,p.y))return{tab:k,key:k,side:s};
 if(S.kind==='animal'&&S.parts.belly.id!=='none'&&pip(bellyPoly(),p.x,p.y))return{tab:'belly',key:'belly'};
 const hg=hairGeo();
 if(hg&&pip(hg.cap,p.x,p.y))return{tab:'hair'};
 for(const k of activeParts('back'))for(const s of[-1,1]){if(S.parts[k].inner&&pip(innerPoly(k,s),p.x,p.y))return{tab:'earInner',key:k,side:s}}
 for(const m of mains().slice().reverse())if(pip(mOutline(m,1,120),p.x,p.y))return{tab:m.id==='head'?'head':'body'};
 for(const k of activeParts('back'))for(const s of[-1,1])if(pip(partPoly(k,s),p.x,p.y))return{tab:k,key:k,side:s};
 if(hg&&((hg.back&&pip(hg.back,p.x,p.y))||(hg.tails&&hg.tails.some(P=>pip(P,p.x,p.y)))))return{tab:'hair'};

}
function startPartDrag(hit,p){

  d.adj=o.adj||{};d.shp=Object.assign(SHP_DEFAULT(),o.shp||{});
  Object.entries(o.fab||{}).forEach(([k,f])=>{d.fab[k]=f?{mat:MAT_BY[f.mat],color:COLOR_BY[f.color]}:null});if(!d.fab.body)d.fab.body={};
  rebuildShapes();d.stuff.regs=regionsFor();(o.regs||[]).forEach(([f,l],i)=>{if(d.stuff.regs[i]){d.stuff.regs[i].fill=f;d.stuff.regs[i].lump=l}});d.stuff.closed=true;

  ctx.font=`bold 15px ${UI_FONT}`;ctx.fillStyle='#8a5a3a';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillText(m.name||'娃娃',24,24);
  ctx.font=`13px ${UI_FONT}`;ctx.fillStyle='#9a8778';ctx.fillText(m.kind==='human'?`身形：${bodyClassOf(m.shp)}・${headClassOf(m.shp)}`:'動物布偶',24,46);
  const C=meta.closet;if(flashing(C)){ctx.font=`bold 16px ${UI_FONT}`;ctx.fillStyle='#d0534a';ctx.textAlign='center';ctx.fillText(C.flash,W/2,H-28)}
  hint('衣櫃：同身形的衣服可以互穿');break}
 case'deliver':{const r=S.result;const g=ctx.createRadialGradient(CX-90,CY-40,40,CX-90,CY,520);g.addColorStop(0,'#fff6ea');g.addColorStop(1,'#e9cfb5');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const b=bbox(S.mode==='garment'?withDoll(gModel(),dollAllPoints):dollAllPoints()).y1;ctx.save();ctx.translate(-90,0);
  ctx.fillStyle='#c98b5e';ell(ctx,CX,b+18,150,26);ctx.fill();ctx.fillStyle='#d9a173';ell(ctx,CX,b+8,150,24);ctx.fill();
  if(S.mode==='garment')drawModelWithGarment(now);else drawDoll(now,{sel:false});ctx.restore();
  if(r.free){ctx.font=`bold 22px ${UI_FONT}`;ctx.fillStyle='#8a5a3a';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('完成！',640,200);ctx.font=`15px ${UI_FONT}`;ctx.fillText(S.mode==='garment'?`收進衣櫃（${S.g.cls}）`:'收進展示櫃',640,232)}
  else{ctx.font=`72px ${EMOJI_FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(S.order.emoji,670,430);
  bubble(510,170,270,r.line,17,'down');
  ctx.font=`30px ${UI_FONT}`;ctx.textAlign='center';ctx.fillStyle='#e0a020';ctx.fillText('★'.repeat(r.stars)+'☆'.repeat(5-r.stars),645,130)}
  ctx.font=`bold 15px ${UI_FONT}`;ctx.fillStyle='#8a5a3a';ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText(S.order.free?(S.mode==='garment'?S.g.name:S.name):`給 ${S.order.who} 的${S.mode==='garment'?'衣服':'娃娃'}`,24,32);
  ctx.font=`13px ${UI_FONT}`;ctx.fillStyle='#9a8778';ctx.fillText(S.mode==='garment'?`${GT_BY[S.g.type].name}・${S.g.cls}・${S.g.fab.mat.name}`:`${S.kind==='human'?'人形娃娃・'+bodyClass():S.body.name}・${new Set(usedSlots().map(s=>fabKey(fab(s)))).size} 種布・${softLabel(overallSoft())}`,24,54);
  S.confetti.forEach(p=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.globalAlpha=clamp(p.l,0,1);ctx.fillRect(-4,-2.5,8,5);ctx.restore()});ctx.globalAlpha=1;
  break}
 }
}

function update(dt,now){
 if(now-ptr.lastMove>60)ptr.speed*=.8;
 if(S.step==='sew'&&SW().phase==='sew'){const sw=SW(),G=S.sew;
  if(G.backHold){const L=sw.path.length,zone=sw.idx>=2&&sw.idx<16?'start':sw.idx>L-16?'end':null;
   if(!zone){if(!flashing(G))flash(G,sw.idx<2?'先車幾針，再回針':'回針要在開頭或結尾做');G.backT=0}
   else if((zone==='start'&&!sw.backStart)||(zone==='end'&&!sw.backEnd)){G.backT+=dt;const n=Math.floor(G.backT*8);if(n!==G._bt){G._bt=n;SFX.thunk()}
    if(G.backT>=.6){zone==='start'?sw.backStart=true:sw.backEnd=true;G.backT=0;flash(G,'回針完成 ✔');SFX.pop();renderControls()}}
  }else G.backT=0}
 if(S.step==='stuff'){const st=S.stuff;
  if(st.clump&&ptr.down&&dist(ptr,BAG)<60)st.clump.size=Math.min(3,st.clump.size+dt*1.5);
  if(!st.closed)sewList().forEach(s=>{if(s.backStart&&s.backEnd)return;const r=mainReg(s.mid);if(r.fill>.7){r.fill-=dt*.05;st.leaked=true}});
  st.squish=Math.max(0,st.squish-dt*2.5);
  st.parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.l-=dt*2.5});st.parts=st.parts.filter(p=>p.l>0);
  const cb=document.getElementById('closeBtn');if(cb)cb.disabled=st.regs.filter(r=>r.main&&!r.bump).some(r=>r.fill<.15);
 }
 if(S.step==='deliver'){S.confetti.forEach(p=>{p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.r+=.1;if(p.y>H-40)p.l-=dt*2});S.confetti=S.confetti.filter(p=>p.l>0)}
 updateStatus();
}
let lastT=performance.now(),sideT=0;
function loop(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;update(dt,now);render(now);if(now-sideT>250){renderSide();sideT=now}requestAnimationFrame(loop)}
loadGame();startOrder();requestAnimationFrame(loop);
</script>
